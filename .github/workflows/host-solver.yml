name: Host Solver 24/7

on:
  schedule:
    - cron: '0 */5 * * *'
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 350 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Download Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start Solver and Get URL
        env:
          # Jika app.js Anda butuh API KEY, masukkan di sini (atau via GitHub Secrets)
          PORT: 7860 
        run: |
          # 1. Jalankan solver (pastikan port sesuai dengan yang ada di app.js)
          node app.js > solver.log 2>&1 &
          
          # 2. Jalankan cloudflared
          ./cloudflared tunnel --url http://localhost:7860 > cf_log.txt 2>&1 &
          
          # 3. Tunggu 15 detik
          sleep 15
          
          # 4. Ambil URL
          URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' cf_log.txt | head -n 1)
          
          # 5. Cek jika URL gagal didapat (berarti solver/cloudflared crash)
          if [ -z "$URL" ]; then
            echo "❌ ERROR: Gagal mendapatkan URL. Berikut adalah log solver:"
            cat solver.log
            echo "Berikut adalah log cloudflared:"
            cat cf_log.txt
            exit 1
          fi
          
          echo "✅ URL Solver Ditemukan: $URL"
          echo $URL > solver_url.txt
          
          # 6. Commit dan Push (dengan Rebase agar tidak bentrok dengan bot auto-generate)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver_url.txt
          git commit -m "Update Solver URL [skip ci]"
          git pull --rebase origin main
          git push

      - name: Keep Server Alive
        run: |
          echo "Solver berjalan. Menunggu 4 jam 55 menit..."
          sleep 17700
