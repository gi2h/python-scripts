name: Host Solver 24/7

on:
  schedule:
    - cron: '0 */5 * * *'
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Download Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start Solver and Get URL
        env:
          PORT: 7860
        run: |
          # 1. Jalankan solver & cloudflared di background
          node app.js > solver.log 2>&1 &
          ./cloudflared tunnel --url http://localhost:7860 > cf_log.txt 2>&1 &
          
          # 2. Tunggu Cloudflare membuat URL
          sleep 15
          
          # 3. Ekstrak URL
          URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' cf_log.txt | head -n 1)
          
          if [ -z "$URL" ]; then
            echo "❌ ERROR: Gagal mendapatkan URL."
            cat solver.log
            cat cf_log.txt
            exit 1
          fi
          
          echo "✅ URL Solver Ditemukan: $URL"
          
          # 4. HANYA bersihkan file log. JANGAN hapus node_modules!
          rm -f solver.log cf_log.txt cloudflared
          
          # 5. Simpan URL dan push
          echo $URL > solver_url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver_url.txt
          git commit -m "Update Solver URL [skip ci]"
          
          # 6. Push paksa (mengabaikan file sampah lain agar tidak error 128)
          git push origin main

      - name: Keep Server Alive
        run: |
          echo "Solver berjalan. Menunggu 4 jam 55 menit..."
          sleep 17700
