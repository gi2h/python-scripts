name: Host Solver 24/7

on:
  schedule:
    - cron: '0 */5 * * *'
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Chrome Dependencies (Ubuntu 24.04 Compatible)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Download Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start Solver and Get URL
        env:
          PORT: 7860
        run: |
          # 1. Jalankan solver & cloudflared
          node app.js > solver.log 2>&1 &
          ./cloudflared tunnel --url http://localhost:7860 > cf_log.txt 2>&1 &
          sleep 15
          
          # 2. Ambil URL
          URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' cf_log.txt | head -n 1)
          
          if [ -z "$URL" ]; then
            echo "❌ ERROR: Gagal mendapatkan URL."
            cat solver.log
            cat cf_log.txt
            exit 1
          fi
          
          echo "✅ URL Solver Ditemukan: $URL"
          
          # 3. Bersihkan file sampah (TAPI JANGAN HAPUS solver.log)
          rm -f cf_log.txt cloudflared
          git checkout -- .
          
          # 4. Tarik update terbaru dari GitHub
          git pull origin main --rebase
          
          # 5. Simpan URL dan Push
          echo $URL > solver_url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver_url.txt
          git commit -m "Update Solver URL [skip ci]"
          git push origin main

      - name: Keep Server Alive
        run: |
          echo "Solver berjalan. Menunggu 4 jam 55 menit..."
          # Jika Anda ingin melihat log secepatnya untuk testing, ubah 17700 menjadi 60 (1 menit)
          sleep 60 

      # --- BAGIAN UPLOAD LOG (Sudah diperbaiki spasinya) ---
      - name: Upload Solver Log
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: solver-log
          path: solver.log
          retention-days: 1
